name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked --version 0.10.0

      - name: Build + Bundle
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Sign with hardened runtime
        # Required for macOS Tahoe (26.x): without --options runtime the
        # status item silently fails to render in the menu bar when launched
        # from /Applications, and ImageIO PNG decoding crashes with SIGBUS
        # when launched from adhoc-signed parents (e.g. Homebrew fish).
        run: |
          codesign --force --options runtime --sign - \
            "target/${{ matrix.target }}/release/bundle/osx/gh-tray.app"

      - name: Package
        run: |
          archive="gh-tray-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release/bundle/osx" "gh-tray.app"
          shasum -a 256 "$archive" | awk '{print $1}' | tr -d '\n' > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gh-tray-${{ matrix.target }}
          path: |
            gh-tray-${{ matrix.target }}.tar.gz
            gh-tray-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -o CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: gh-tray-*/*
          body: ${{ steps.changelog.outputs.content }}

  update-packaging:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4

      - name: Read SHA256s
        id: sha
        run: |
          echo "arm=$(cat gh-tray-aarch64-apple-darwin/gh-tray-aarch64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "intel=$(cat gh-tray-x86_64-apple-darwin/gh-tray-x86_64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/update_cask.py "${VERSION#v}" "${{ steps.sha.outputs.arm }}" "${{ steps.sha.outputs.intel }}" Casks/gh-tray.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gh-tray.rb
          git diff --cached --quiet || git commit -m "chore: update homebrew cask for ${{ github.ref_name }}"
          git push origin HEAD:main
