[package]
name = "gh-tray"
version = "0.0.11"
edition = "2024"
description = "macOS menu bar app monitoring GitHub PRs"

[dependencies]
tray-icon = "0.25"
muda = "0.20"
global-hotkey = "0.8"
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"
ab_glyph = "0.2"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3", default-features = false }
objc2-app-kit = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
strip = "debuginfo"
lto = "thin"

[package.metadata.bundle]
name = "gh-tray"
identifier = "io.github.jsfr.gh-tray"
icon = ["assets/AppIcon.icns"]
category = "public.app-category.developer-tools"
short_description = "macOS menu bar app monitoring GitHub PRs"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["assets/macos/Info.plist.frag"]
